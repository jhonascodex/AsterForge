name: asterforge

services:
  database:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - internal
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      dockerfile: Containerfile
    environment:
      ASTERFORGE_ENVIRONMENT: ${ASTERFORGE_ENVIRONMENT:-development}
      ASTERFORGE_LOG_LEVEL: ${ASTERFORGE_LOG_LEVEL:-INFO}
      ASTERFORGE_DATABASE_URL: ${ASTERFORGE_DATABASE_URL:?Set ASTERFORGE_DATABASE_URL in .env}
      ASTERFORGE_CORS_ORIGINS: ${ASTERFORGE_CORS_ORIGINS:-["http://localhost:4173"]}
      ASTERFORGE_SESSION_TTL_MINUTES: ${ASTERFORGE_SESSION_TTL_MINUTES:-480}
      ASTERFORGE_SESSION_COOKIE_SECURE: ${ASTERFORGE_SESSION_COOKIE_SECURE:-false}
      ASTERFORGE_LOGIN_ATTEMPT_LIMIT: ${ASTERFORGE_LOGIN_ATTEMPT_LIMIT:-5}
      ASTERFORGE_LOGIN_ATTEMPT_WINDOW_MINUTES: ${ASTERFORGE_LOGIN_ATTEMPT_WINDOW_MINUTES:-15}
      ASTERFORGE_LOGIN_BLOCK_MINUTES: ${ASTERFORGE_LOGIN_BLOCK_MINUTES:-15}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      database:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Containerfile
    environment:
      ASTERFORGE_ENVIRONMENT: ${ASTERFORGE_ENVIRONMENT:-development}
      ASTERFORGE_LOG_LEVEL: ${ASTERFORGE_LOG_LEVEL:-INFO}
      ASTERFORGE_DATABASE_URL: ${ASTERFORGE_DATABASE_URL:?Set ASTERFORGE_DATABASE_URL in .env}
      ASTERFORGE_CORS_ORIGINS: ${ASTERFORGE_CORS_ORIGINS:-["http://localhost:4173"]}
      ASTERFORGE_SESSION_TTL_MINUTES: ${ASTERFORGE_SESSION_TTL_MINUTES:-480}
      ASTERFORGE_SESSION_COOKIE_SECURE: ${ASTERFORGE_SESSION_COOKIE_SECURE:-false}
      ASTERFORGE_LOGIN_ATTEMPT_LIMIT: ${ASTERFORGE_LOGIN_ATTEMPT_LIMIT:-5}
      ASTERFORGE_LOGIN_ATTEMPT_WINDOW_MINUTES: ${ASTERFORGE_LOGIN_ATTEMPT_WINDOW_MINUTES:-15}
      ASTERFORGE_LOGIN_BLOCK_MINUTES: ${ASTERFORGE_LOGIN_BLOCK_MINUTES:-15}
      ASTERFORGE_BOOTSTRAP_ADMIN_USERNAME: ${ASTERFORGE_BOOTSTRAP_ADMIN_USERNAME:-}
      ASTERFORGE_BOOTSTRAP_ADMIN_PASSWORD: ${ASTERFORGE_BOOTSTRAP_ADMIN_PASSWORD:-}
      ASTERFORGE_INTEGRATION_ENCRYPTION_KEY: ${ASTERFORGE_INTEGRATION_ENCRYPTION_KEY:?Set ASTERFORGE_INTEGRATION_ENCRYPTION_KEY in .env}
      ASTERFORGE_AMI_MONITORING_ENABLED: ${ASTERFORGE_AMI_MONITORING_ENABLED:-true}
      ASTERFORGE_AMI_CONNECT_TIMEOUT_SECONDS: ${ASTERFORGE_AMI_CONNECT_TIMEOUT_SECONDS:-5}
      ASTERFORGE_AMI_ACTION_TIMEOUT_SECONDS: ${ASTERFORGE_AMI_ACTION_TIMEOUT_SECONDS:-5}
      ASTERFORGE_AMI_POLL_INTERVAL_SECONDS: ${ASTERFORGE_AMI_POLL_INTERVAL_SECONDS:-30}
      ASTERFORGE_AMI_INVENTORY_REFRESH_SECONDS: ${ASTERFORGE_AMI_INVENTORY_REFRESH_SECONDS:-10}
      ASTERFORGE_AMI_RECONNECT_MIN_SECONDS: ${ASTERFORGE_AMI_RECONNECT_MIN_SECONDS:-1}
      ASTERFORGE_AMI_RECONNECT_MAX_SECONDS: ${ASTERFORGE_AMI_RECONNECT_MAX_SECONDS:-60}
      ASTERFORGE_CDR_SOURCE: ${ASTERFORGE_CDR_SOURCE:-disabled}
      ASTERFORGE_CEL_SOURCE: ${ASTERFORGE_CEL_SOURCE:-disabled}
      ASTERFORGE_HOST_TELEMETRY_ENABLED: ${ASTERFORGE_HOST_TELEMETRY_ENABLED:-false}
      ASTERFORGE_HOST_TELEMETRY_PORT: ${ASTERFORGE_HOST_TELEMETRY_PORT:-9100}
      ASTERFORGE_HOST_TELEMETRY_TIMEOUT_SECONDS: ${ASTERFORGE_HOST_TELEMETRY_TIMEOUT_SECONDS:-5}
      ASTERFORGE_HOST_TELEMETRY_POLL_INTERVAL_SECONDS: ${ASTERFORGE_HOST_TELEMETRY_POLL_INTERVAL_SECONDS:-60}
      ASTERFORGE_HOST_TELEMETRY_INVENTORY_REFRESH_SECONDS: ${ASTERFORGE_HOST_TELEMETRY_INVENTORY_REFRESH_SECONDS:-10}
      ASTERFORGE_HOST_TELEMETRY_RECORDING_MOUNTPOINT: ${ASTERFORGE_HOST_TELEMETRY_RECORDING_MOUNTPOINT:-/var/spool/asterisk/monitor}
      ASTERFORGE_LOG_INGESTION_ENABLED: ${ASTERFORGE_LOG_INGESTION_ENABLED:-false}
      ASTERFORGE_LOG_SOURCE_ROOT: ${ASTERFORGE_LOG_SOURCE_ROOT:-/var/lib/asterforge/log-sources}
      ASTERFORGE_LOG_POLL_INTERVAL_SECONDS: ${ASTERFORGE_LOG_POLL_INTERVAL_SECONDS:-5}
      ASTERFORGE_LOG_INVENTORY_REFRESH_SECONDS: ${ASTERFORGE_LOG_INVENTORY_REFRESH_SECONDS:-10}
      ASTERFORGE_LOG_READ_MAX_BYTES: ${ASTERFORGE_LOG_READ_MAX_BYTES:-1048576}
      ASTERFORGE_LOG_READ_MAX_LINES: ${ASTERFORGE_LOG_READ_MAX_LINES:-1000}
      ASTERFORGE_LOG_RETENTION_INTERVAL_SECONDS: ${ASTERFORGE_LOG_RETENTION_INTERVAL_SECONDS:-3600}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./log-sources:/var/lib/asterforge/log-sources:ro
    networks:
      - internal
      - edge
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:4173:4173"
    networks:
      - edge
    restart: unless-stopped

networks:
  internal:
    internal: true
  edge:

volumes:
  postgres_data:
