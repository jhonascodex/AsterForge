[global]
type = global
user_agent = AsterForge release lab

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[lab-endpoint]
type = endpoint
context = release-lab
disallow = all
allow = ulaw
aors = lab-endpoint
direct_media = no

[lab-endpoint]
type = aor
contact = sip:127.0.0.1:5060
qualify_frequency = 5

[lab-trunk-auth]
type = auth
auth_type = userpass
username = lab-trunk
password = test-only-trunk-password

[lab-trunk]
type = endpoint
context = release-lab
disallow = all
allow = ulaw
auth = lab-trunk-auth
aors = lab-trunk
direct_media = no

[lab-trunk]
type = aor
max_contacts = 2
remove_existing = yes

[lab-trunk-registration]
type = registration
transport = transport-udp
server_uri = sip:127.0.0.1:5060
client_uri = sip:lab-trunk@127.0.0.1
contact_user = lab-trunk
outbound_auth = lab-trunk-auth
retry_interval = 5
forbidden_retry_interval = 5
max_retries = 5
expiration = 60
