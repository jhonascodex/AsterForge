[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asterforge-backend"
version = "0.1.0"
description = "AsterForge V1 API"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic==1.16.5",
  "argon2-cffi==25.1.0",
  "asyncpg==0.31.0",
  "cryptography==50.0.1",
  "fastapi==0.141.1",
  "pydantic-settings==2.11.0",
  "sqlalchemy[asyncio]==2.0.52",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite==0.21.0",
  "httpx==0.28.1",
  "mypy==1.18.2",
  "pytest==9.0.3",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["app"]
