[general]
enabled = yes
webenabled = no
port = 5038
bindaddr = 0.0.0.0
displayconnects = no
timestampevents = yes

; Test-only account used by AsterForge. It intentionally cannot originate calls,
; execute commands, or change configuration.
[asterforge-readonly]
secret = test-only-read-password
deny = 0.0.0.0/0.0.0.0
permit = 10.0.0.0/255.0.0.0
permit = 172.16.0.0/255.240.0.0
permit = 192.168.0.0/255.255.0.0
read = system,call,reporting
; AMI calls these action authorization classes "write" even for query-only
; actions. The application allowlist remains the narrower authoritative boundary.
write = system,call,reporting

; Separate fixture controller. The verification driver uses this account only
; to create an internal, PSTN-free call after proving the read-only account is denied.
[release-lab-fixture]
secret = test-only-fixture-password
deny = 0.0.0.0/0.0.0.0
permit = 10.0.0.0/255.0.0.0
permit = 172.16.0.0/255.240.0.0
permit = 192.168.0.0/255.255.0.0
read = system,call,reporting
write = originate
